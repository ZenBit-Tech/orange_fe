name: Deploy to Heroku

# Deploys to Heroku through the app's git remote. This replaces the dashboard
# Heroku<->GitHub integration, which was tied to a single person's OAuth session
# and breaks when that account is closed.
#
# Required repository secret: HEROKU_API_KEY

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-plasmai-fe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          if [ -z "$HEROKU_API_KEY" ]; then
            echo "HEROKU_API_KEY secret is not set"
            exit 1
          fi
          git push --force "https://heroku:$HEROKU_API_KEY@git.heroku.com/plasmai-fe.git" HEAD:refs/heads/main

      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # The edge caches www.plasmai.app for hours so the dyno can fall asleep, which
          # also means a fresh deploy stays invisible until the cache expires.
          # Purging here keeps the long TTL without the stale-deploy side effect.
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set - skipping cache purge"
            exit 0
          fi
          curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/87e38cd70a7faeac382baa0924787a22/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' > /dev/null
          echo "purged Cloudflare cache for www.plasmai.app"
